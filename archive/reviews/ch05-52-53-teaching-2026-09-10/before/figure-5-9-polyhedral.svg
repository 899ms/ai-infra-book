   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="47.088" y="31.4406" transform="rotate(-0 47.088 31.4406)">先保存完整矩阵</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="491.688" y="31.4406" transform="rotate(-0 491.688 31.4406)">逐块计算并激活</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 101.484569)">for i, j:</text>
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 122.217537)">    acc = 0</text>
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 141.784569)">    for k:</text>
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 159.935819)">        acc += A[i,k] × W[k,j]</text>
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 179.5191)">    C[i,j] = BF16(acc)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="222.705" y="333.748124" transform="rotate(-0 222.705 333.748124)">完整 C：24 MiB</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #55707d" x="222.705" y="360.825991" transform="rotate(-0 222.705 360.825991)">写出一次，再读入一次</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 457.209569)">for i, j:</text>
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(64.872 476.713631)">    Y[i,j] = SiLU(C[i,j])</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(423.332 137.036712)">split / tile</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(426.665594 153.917669)">reorder</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="500.58" y="88.3566" transform="rotate(-0 500.58 88.3566)">for io, jo:   16 × 192 个输出块</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="522.81" y="148.380998" transform="rotate(-0 522.81 148.380998)">acc：64 × 64，FP32，16 KiB</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="540.594" y="222.1092" transform="rotate(-0 540.594 222.1092)">for ko:   128 个归约块</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(540.594 281.794793)">A 块 64 × 32：4 KiB</text>
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(540.594 300.929754)">W 块 32 × 64：4 KiB</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="540.594" y="355.8618" transform="rotate(-0 540.594 355.8618)">acc += A 块 × W 块</text>
   </g>
   <g id="text_13">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(522.81 460.049275)">c = BF16(acc)</text>
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; fill: #193441" transform="translate(522.81 480.274431)">写出 SiLU(c)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #138b83" x="687.312" y="401.3946" transform="rotate(-0 687.312 401.3946)">归约结束</text>
   </g>
   <g id="text_15">
    <text style="font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #c9782b" x="47.088" y="566.451" transform="rotate(-0 47.088 566.451)">C 的写出与读取：48 MiB</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #246f91" x="491.688" y="566.451" transform="rotate(-0 491.688 566.451)">输入槽随 ko 更新；acc 跨 ko 保留</text>
   </g>
  </g>
