   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="767.34" y="104.571749" transform="rotate(-0 767.34 104.571749)">加入第二块的贡献</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(732.10875 129.249985)">ℓ = 0.5 + 1 = 1.5</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(730.78375 143.319809)">u = 0.5 + 3 = 3.5</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="456.12" y="255.54923" transform="rotate(-0 456.12 255.54923)">第二块：s = ln 2，V = 3</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #55707d" x="456.12" y="284.484782" transform="rotate(-0 456.12 284.484782)">以 ln 2 为基准，指数为 1</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="767.34" y="255.984172" transform="rotate(-0 767.34 255.984172)">全部块处理完，再相除</text>
