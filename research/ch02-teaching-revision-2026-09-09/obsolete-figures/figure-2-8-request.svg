   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="45.36" y="43.826312" transform="rotate(-0 45.36 43.826312)">图 2-8  请求输入与计算状态映射</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #55707d" x="45.36" y="75.478656" transform="rotate(-0 45.36 75.478656)">统一资源请求：S=0、P=128、G=4、B=1；首输出来自 prefill，decode 调用为 G−1=3。</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="153.72" y="157.581656" transform="rotate(-0 153.72 157.581656)">Prefill</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(112.092656 190.892797)">输入 128 → 输出 y₁</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(122.600469 203.729516)">保留 128 位置</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="390.6" y="157.581656" transform="rotate(-0 390.6 157.581656)">Decode 1</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(353.149219 190.892797)">输入 y₁ → 输出 y₂</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(359.480469 203.729516)">保留 129 位置</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="627.48" y="157.581656" transform="rotate(-0 627.48 157.581656)">Decode 2</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(590.029219 190.892797)">输入 y₂ → 输出 y₃</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(596.360469 203.729516)">保留 130 位置</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="864.36" y="157.581656" transform="rotate(-0 864.36 157.581656)">Decode 3</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(826.909219 190.892797)">输入 y₃ → 输出 y₄</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(833.240469 203.729516)">保留 131 位置</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #c9782b" x="55.44" y="259.2" transform="rotate(-0 55.44 259.2)">y₄ 已返回但尚未再次进入模型；最终状态不是 132 个位置。</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="801.36" y="380.124153" transform="rotate(-0 801.36 380.124153)">另一个证据：同消息检索</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(746.062344 438.2058)">Qwen 与 V4 Flash 各 8/8</text>
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; fill: #55707d" transform="translate(731.351406 451.192519)">输入 token 数、部署与精度不同</text>
