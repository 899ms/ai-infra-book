   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #55707d" x="456.12" y="136.441147" transform="rotate(-0 456.12 136.441147)">旧 ℓ、u 同乘 1/2</text>
