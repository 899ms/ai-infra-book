   <g id="text_2">
    <text style="font-size: 10px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #55707d" x="144.9" y="135.640366" transform="rotate(-0 144.9 135.640366)">m = 0，ℓ = 1，u = 1</text>
