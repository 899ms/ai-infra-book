   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Arial Unicode MS'; text-anchor: middle; fill: #193441" x="456.12" y="104.539249" transform="rotate(-0 456.12 104.539249)">换用新最大值 ln 2</text>
