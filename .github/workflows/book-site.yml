name: Build and publish book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so an older build cannot overwrite a newer deployment.
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - name: Fetch book figures
        run: git lfs pull --include="manuscripts/**/*.svg,manuscripts/**/*.png,manuscripts/**/*.jpg,manuscripts/**/*.jpeg" --exclude=""
      - name: Enforce Markdown source policy
        run: python scripts/check_no_html.py
      - name: Install website dependencies
        run: pip install -r website/requirements.txt
      - name: Build and check website
        run: |
          python scripts/build_site.py
          python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Package website
        run: tar -czf build/ai-infra-book-site.tar.gz -C build/site .
      - uses: actions/upload-artifact@v4
        with:
          name: book-site-download
          path: build/ai-infra-book-site.tar.gz
          if-no-files-found: error

  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk space for TeX
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PDF figures and fonts
        run: git lfs pull --include="manuscripts/**/*.pdf,manuscripts/**/*.png,manuscripts/figure_style/fonts/**" --exclude=""
      - name: Install Pandoc, XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y lmodern pandoc texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-science texlive-bibtex-extra fonts-texgyre fonts-noto-cjk fonts-dejavu-core poppler-utils ghostscript
          sudo apt-get clean
          curl --fail --location --retry 3 --output /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version
          for package in lmodern.sty biblatex.sty pzdr.tfm ctex.sty newtxmath.sty esint.sty adforn.sty fvextra.sty placeins.sty xurl.sty tcolorbox.sty; do
            kpsewhich "$package"
          done
          pip install -r book/requirements-ci.txt
      - name: Build full book PDF
        env:
          BOOK_SOURCE_REF: ${{ github.sha }}
        run: bash book/build_pdf.sh --output-dir ../build/pdf --source-ref "$BOOK_SOURCE_REF"
      - name: Validate PDF and render representative pages
        run: python book/check_ci_pdf.py build/pdf
      - name: Upload PDF release files
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf-download
          if-no-files-found: error
          path: |
            build/pdf/AI-Infra-Book.pdf
            build/pdf/AI-Infra-Book-build.json
            build/pdf/AI-Infra-Book-Cover.pdf
            build/pdf/AI-Infra-Book-Cover.png
            build/pdf/pdf-validation.json
      - name: Save logs and visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-build-diagnostics
          path: |
            book/build/AI-Infra-Book/*.log
            build/pdf/preview-*.png
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [website, pdf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: book-*-download
          path: dist
          merge-multiple: true
      - name: Create checksums and release notes
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          sha256sum AI-Infra-Book* ai-infra-book-site.tar.gz pdf-validation.json > SHA256SUMS
          python - <<'PY'
          import os
          from pathlib import Path
          sha = os.environ['SOURCE_SHA']
          repo = os.environ['REPOSITORY']
          Path('../release-notes.md').write_text(
              f'自动从 main 提交 [{sha}](https://github.com/{repo}/commit/{sha}) 构建。\n\n'
              '- `AI-Infra-Book.pdf`：十二章全书 PDF。\n'
              '- `AI-Infra-Book-Cover.pdf/png`：封面。\n'
              '- `ai-infra-book-site.tar.gz`：同一提交构建的阅读网站。\n'
              '- `AI-Infra-Book-build.json`、`pdf-validation.json`：来源与校验记录。\n'
              '- `SHA256SUMS`：附件校验值。\n')
          PY
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="build-${SOURCE_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "Book ${SOURCE_SHA:0:12}" --notes-file release-notes.md --draft
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [website, pdf]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@v4
