   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="55.44" y="573.48" transform="rotate(-0 55.44 573.48)">左：计算结果按各自声明路径累计；右：八题实测只支持这组窄任务，不是左侧资源请求的性能测量。</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #55707d" x="55.44" y="612.36" transform="rotate(-0 55.44 612.36)">已有记录未闭合完整 HBM、运行峰值或时延；同 token 几何不保证同文本与同质量。</text>
   </g>
