  </g>
  <g id="text_28">
   <text style="font-size: 11px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="54" y="73.44" transform="rotate(-0 54 73.44)">容量使用十进制 GB；固定工作区 2 GiB，BF16 KV，8192 历史，每柱包含一个请求。</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #193441" x="54" y="553.86" transform="rotate(-0 54 553.86)">低位方案保留部分高精度权重并计 scale／尾部；70B 4-bit 在 32K 历史下的算术上限降为 3 条。</text>
  </g>
  <g id="text_30">
   <text style="font-size: 11px; font-family: 'Arial Unicode MS'; text-anchor: start; fill: #55707d" x="54" y="584.46" transform="rotate(-0 54 584.46)">容量与专家宽度使用不同坐标；未训练变体不证明同质量，容量通过不证明真实可服务并发。</text>
  </g>
