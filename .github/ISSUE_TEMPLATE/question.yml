name: 问题与讨论
description: 对书中推导、实验或设计取舍的疑问
labels: [问题]
body:
  - type: input
    id: location
    attributes:
      label: 相关章节
      placeholder: 第 8 章 8.3 节
  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 你的疑问，以及已经尝试过的推算或实验（模型、硬件、输入参数）
    validations:
      required: true
