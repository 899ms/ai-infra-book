<!doctype html><html lang="en"><meta charset="utf-8"><title>Lab Supply — test order</title>
<style>
*{box-sizing:border-box}body{margin:0;font:18px system-ui;background:#eef2f6;color:#172938}header{background:#143447;color:white;padding:22px 48px;display:flex;justify-content:space-between}main{max-width:1120px;margin:28px auto;display:grid;grid-template-columns:760px 330px;gap:25px}.card{background:white;border:1px solid #d8e0e6;border-radius:12px;padding:26px}h1{margin:0 0 6px;font-size:29px}h2{font-size:19px;margin:25px 0 10px}.muted{color:#526676;font-size:15px}.choices{display:flex;gap:12px}button{font:inherit;padding:13px 20px;border:1px solid #bacbd5;background:white;border-radius:8px;cursor:pointer}button.selected{border:2px solid #08776f;background:#e8f7f4;color:#075e57}.product{width:210px;text-align:left;line-height:1.6}.price{font-size:15px;color:#536674}label{display:block;margin:20px 0 8px}input{font:inherit;border:1px solid #9bb0bd;border-radius:6px;padding:12px;width:100%}.row{display:grid;grid-template-columns:140px 1fr;gap:22px}.save{background:#08776f;color:white;width:100%;margin-top:25px}.summary{line-height:1.9}.banner{background:#e8f7f4;border:1px solid #08776f;padding:20px;border-radius:8px;margin-top:20px}#error{color:#a32222;min-height:25px;margin-top:12px}code{font:16px ui-monospace;white-space:pre-wrap}
</style>
<header><strong>LAB SUPPLY</strong><span>Isolated experiment · no real purchases</span></header>
<main><section class="card"><h1>Create a supply order</h1><div class="muted">Choose supplies and delivery for your project.</div>
<h2>Warehouse</h2><div class="choices" id="warehouse"><button class="selected" data-value="West">West</button><button data-value="East">East</button><button data-value="Central">Central</button></div>
<h2>Product</h2><div class="choices" id="product"><button class="product selected" data-value="HDMI Cable">HDMI Cable<br><span class="price">SKU HDMI-2M · $8</span></button><button class="product" data-value="USB-C Adapter">USB-C Adapter<br><span class="price">SKU USB-C-AD · $15</span></button><button class="product" data-value="Ethernet Cable">Ethernet Cable<br><span class="price">SKU CAT6-3M · $6</span></button></div>
<div class="row"><div><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="50" value="1"></div><div><label for="project">Project name</label><input id="project" value="" placeholder="Enter project name"></div></div>
<h2>Delivery</h2><div class="choices" id="delivery"><button class="selected" data-value="Standard">Standard · 5 days</button><button data-value="Express">Express · next day</button></div>
<button class="save" id="save">Save order</button><div id="error"></div><div id="receipt"></div></section>
<aside class="card"><h1>Order summary</h1><div class="summary" id="summary"></div><hr><p class="muted">This page is a local test application. Saving only records state in this browser session.</p></aside></main>
<script>
window.orderState={warehouse:'West',product:'HDMI Cable',quantity:1,project:'',delivery:'Standard',saved:false};window.actionLog=[];
const prices={'HDMI Cable':8,'USB-C Adapter':15,'Ethernet Cable':6};
function update(){const s=window.orderState;s.quantity=Number(document.querySelector('#quantity').value);s.project=document.querySelector('#project').value;document.querySelector('#summary').textContent=`${s.product} × ${s.quantity}\nWarehouse: ${s.warehouse}\nDelivery: ${s.delivery}\nSubtotal: $${prices[s.product]*s.quantity}`;document.querySelector('#summary').style.whiteSpace='pre-line'}
for(const field of ['warehouse','product','delivery'])document.querySelector('#'+field).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;window.orderState[field]=b.dataset.value;for(const x of b.parentElement.children)x.classList.toggle('selected',x===b);window.orderState.saved=false;window.actionLog.push({kind:'choose',field,value:b.dataset.value,at:performance.now()});update()});
for(const id of ['quantity','project'])document.querySelector('#'+id).addEventListener('input',()=>{window.orderState.saved=false;update();window.actionLog.push({kind:'input',field:id,value:document.querySelector('#'+id).value,at:performance.now()})});
document.querySelector('#save').addEventListener('click',()=>{update();const s=window.orderState;if(!s.project.trim()||!Number.isInteger(s.quantity)||s.quantity<1||s.quantity>50){document.querySelector('#error').textContent='Enter a project and a quantity from 1 to 50.';return}document.querySelector('#error').textContent='';s.saved=true;window.actionLog.push({kind:'save',state:{...s},at:performance.now()});document.querySelector('#receipt').className='banner';document.querySelector('#receipt').textContent='Order saved · '+s.quantity+' × '+s.product+' for '+s.project+' · '+s.warehouse+' · '+s.delivery});update();
</script></html>
